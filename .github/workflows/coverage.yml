name: Code Coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  release:
    types: [published]

jobs:
  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-24.04
    outputs:
      coverage_percent: ${{ steps.coverage.outputs.percentage }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            lcov \
            ninja-build \
            socat

          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Install dependencies with vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure with coverage
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DWIRESTEAD_ENABLE_CONFIG=ON \
            -DWIRESTEAD_ENABLE_TLS=ON \
            -DWIRESTEAD_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET

      - name: Build with coverage
        run: cmake --build build-coverage -j $(nproc)

      - name: Run tests
        run: |
          cd build-coverage
          ctest --output-on-failure --parallel 2

      - name: Generate coverage report
        run: |
          cd build-coverage

          # Capture coverage data
          lcov --directory . --capture --output-file coverage.info \
            --ignore-errors mismatch,negative,unused \
            --rc lcov_branch_coverage=1

          # Debug: Show total coverage before filtering
          echo "=== Before filtering ==="
          lcov --summary coverage.info --rc lcov_branch_coverage=1 2>&1 | grep lines

          # Step 1: Extract wirestead directory using absolute path
          echo "=== Step 1: Extract wirestead directory ==="
          lcov --extract coverage.info \
            "${GITHUB_WORKSPACE}/wirestead/*" \
            --output-file coverage_temp.info \
            --ignore-errors mismatch,negative,unused \
            --rc lcov_branch_coverage=1
          lcov --summary coverage_temp.info --rc lcov_branch_coverage=1 2>&1 | grep lines

          # Step 2: Remove unwanted files (test, _deps, build)
          #
          # --filter branch drops the branches gcc emits for C++ exception
          # unwinding on lines that contain no conditional at all. They are
          # never reachable from a test, and they were over half of every
          # branch counted here: 8596 of 15592 on the 1d367b9fc tree, which
          # reported 52.2% branch coverage instead of the real 65.7%. The
          # filter is applied here rather than at summary time so the .info
          # artifact, the HTML report and the printed number all agree.
          echo "=== Step 2: Remove test and dependency files ==="
          lcov --remove coverage_temp.info \
            "*/test/*" \
            "*/_deps/*" \
            "*/build-coverage/*" \
            --output-file coverage_filtered.info \
            --ignore-errors mismatch,negative,unused \
            --filter branch \
            --rc lcov_branch_coverage=1

          # Debug: Show coverage after filtering
          echo "=== After filtering ==="
          lcov --summary coverage_filtered.info --rc lcov_branch_coverage=1 2>&1 | grep lines

          # Debug: Show filtered files
          echo "=== Filtered files (first 30) ==="
          lcov --list coverage_filtered.info --rc lcov_branch_coverage=1 2>&1 | head -30

          # Generate summary
          lcov --list coverage_filtered.info --rc lcov_branch_coverage=1 > coverage_summary.txt

          # Generate HTML report
          genhtml coverage_filtered.info --output-directory coverage_html \
            --title "Wirestead Coverage Report" \
            --legend --show-details \
            --branch-coverage \
            --rc lcov_branch_coverage=1

      - name: Calculate coverage percentage
        id: coverage
        run: |
          cd build-coverage
          COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "### 📊 Code Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage_summary.txt | tail -20 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Save PR Info for Comment
        if: github.event_name == 'pull_request'
        run: |
          echo ${{ github.event.pull_request.number }} > build-coverage/pr_number.txt
          echo ${{ steps.coverage.outputs.percentage }} > build-coverage/coverage_percent.txt

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build-coverage/coverage_html
          retention-days: 30
          overwrite: true

      - name: Upload Coverage Data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: |
            build-coverage/coverage_filtered.info
            build-coverage/coverage_summary.txt
            build-coverage/pr_number.txt        
            build-coverage/coverage_percent.txt
          retention-days: 30
          overwrite: true

      - name: Coverage Check
        run: |
          cd build-coverage
          COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"

          # Measured 85.6% line coverage on 1d367b9fc (801 tests, all passing),
          # so the old 65 left 20 points of slack: coverage could rot by a
          # fifth of the library without turning this job red. 80 keeps a real
          # margin for a skipped test or a platform difference while still
          # catching an actual regression.
          THRESHOLD=80

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

  notify-docs:
    name: Notify wirestead-docs of release
    needs: coverage
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      # wirestead-docs owns the combined API-reference + coverage Pages site
      # now (actions/deploy-pages can only publish to the repo the workflow
      # runs in, so this repo no longer builds or deploys anything - it just
      # runs its own tests/coverage and wakes wirestead-docs up on release).
      # No payload is sent: wirestead-docs resolves the latest published
      # release and this run's coverage-report artifact itself, so it stays
      # correct even on a re-run.
      - name: Notify wirestead-docs
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.WIRESTEAD_DOCS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wirestead/wirestead-docs/dispatches \
            -d '{"event_type":"core-released"}'
